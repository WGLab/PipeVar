<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Nuclear Rare-Disease Workflow</title>
  <desc id="desc">Focused workflow figure for nuclear SNV, SV, repeat expansion, phenotype extraction, annotation, and prioritization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f5f78"/>
    </marker>
    <style>
      .canvas { fill: #f7faf8; }
      .lane { fill: #eef4f0; stroke: #aac0b5; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #49687f; stroke-width: 1.5; rx: 8; }
      .input { fill: #fbf7e9; stroke: #9c7b35; }
      .output { fill: #edf6fb; stroke: #336b87; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #173245; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #223642; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #415866; }
      .flow { fill: none; stroke: #3f5f78; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1320" height="760"/>
  <text class="label" x="40" y="44">Figure 1. Nuclear Rare-Disease Workflow</text>

  <rect class="box input" x="40" y="85" width="170" height="82"/>
  <text class="text" x="62" y="116">Input data</text>
  <text class="small" x="62" y="142">BAM/CRAM or VCF</text>

  <rect class="box input" x="40" y="206" width="170" height="98"/>
  <text class="text" x="62" y="237">Reference resources</text>
  <text class="small" x="62" y="263">FASTA</text>
  <text class="small" x="62" y="281">annotation data</text>

  <rect class="box input" x="40" y="344" width="170" height="98"/>
  <text class="text" x="62" y="375">Phenotype input</text>
  <text class="small" x="62" y="401">Clinical note</text>
  <text class="small" x="62" y="419">or HPO terms</text>

  <rect class="lane" x="250" y="318" width="190" height="162" rx="10"/>
  <text class="label" x="270" y="348">Phenotype</text>
  <rect class="box" x="275" y="370" width="140" height="38"/>
  <text class="text" x="300" y="394">PhenoTagger</text>
  <rect class="box" x="275" y="426" width="140" height="38"/>
  <text class="text" x="306" y="450">Phen2Gene</text>

  <rect class="lane" x="480" y="80" width="235" height="176" rx="10"/>
  <text class="label" x="500" y="111">SNV/indel</text>
  <rect class="box" x="505" y="133" width="185" height="82"/>
  <text class="text" x="526" y="161">DeepVariant</text>
  <text class="text" x="526" y="181">HaplotypeCaller</text>
  <text class="text" x="526" y="201">Clair3 / NanoCaller</text>
  <rect class="box" x="748" y="108" width="145" height="44"/>
  <text class="text" x="786" y="136">ANNOVAR</text>
  <rect class="box" x="748" y="172" width="145" height="64"/>
  <text class="text" x="783" y="198">RankVar</text>
  <text class="text" x="778" y="218">RankScore</text>

  <rect class="lane" x="480" y="292" width="235" height="150" rx="10"/>
  <text class="label" x="500" y="323">SV</text>
  <rect class="box" x="505" y="345" width="185" height="64"/>
  <text class="text" x="554" y="371">Manta</text>
  <text class="text" x="548" y="391">Sniffles</text>
  <rect class="box" x="748" y="305" width="145" height="44"/>
  <text class="text" x="775" y="333">ANNOVAR_SV</text>
  <rect class="box" x="748" y="369" width="145" height="64"/>
  <text class="text" x="781" y="395">SURVIVOR</text>
  <text class="text" x="788" y="415">PhenoSV</text>

  <rect class="lane" x="480" y="500" width="235" height="128" rx="10"/>
  <text class="label" x="500" y="531">Repeat expansion</text>
  <rect class="box" x="505" y="553" width="185" height="54"/>
  <text class="text" x="536" y="575">ExpansionHunter</text>
  <text class="text" x="538" y="595">eh_filter / NanoRepeat</text>

  <rect class="lane" x="940" y="198" width="190" height="224" rx="10"/>
  <text class="label" x="964" y="229">Prioritization</text>
  <rect class="box" x="965" y="252" width="140" height="58"/>
  <text class="text" x="999" y="276">ngs_prio</text>
  <text class="text" x="999" y="296">longphase</text>
  <rect class="box" x="965" y="334" width="140" height="58"/>
  <text class="text" x="1000" y="358">snp_prio</text>
  <text class="text" x="1003" y="378">sv_prio</text>

  <rect class="box output" x="1160" y="214" width="130" height="190"/>
  <text class="text" x="1188" y="244">Outputs</text>
  <text class="small" x="1183" y="275">prioritized VCF</text>
  <text class="small" x="1183" y="301">gene-level VCF</text>
  <text class="small" x="1183" y="327">repeat table</text>
  <text class="small" x="1183" y="353">HTML report</text>

  <path class="flow" d="M210,116 H350 V158 H505"/>
  <path class="flow" d="M210,132 H330 V360 H505"/>
  <path class="flow" d="M210,148 H310 V564 H505"/>
  <path class="flow" d="M210,236 H392 V188 H505"/>
  <path class="flow" d="M210,255 H370 V388 H505"/>
  <path class="flow" d="M210,274 H392 V594 H505"/>
  <path class="flow" d="M210,393 L275,389"/>
  <path class="flow" d="M415,386 H455 V118 H748"/>
  <path class="flow" d="M415,444 H468 V317 H748"/>
  <path class="flow" d="M690,174 H724 V140 H748"/>
  <path class="flow" d="M893,128 H918 V264 H965"/>
  <path class="flow" d="M893,196 H930 V282 H965"/>
  <path class="flow" d="M893,214 H906 V348 H965"/>
  <path class="flow" d="M690,377 H724 V337 H748"/>
  <path class="flow" d="M893,392 H930 V296 H965"/>
  <path class="flow" d="M893,414 H918 V374 H965"/>
  <path class="flow" d="M690,580 H836 V304 H965"/>
  <path class="flow" d="M1105,274 H1160"/>
  <path class="flow" d="M1105,370 H1160"/>
</svg>
