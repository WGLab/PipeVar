  <text class="small" x="85" y="262">ml | omim | gnomad</text>
  <text class="small" x="73" y="282">dominant/recessive</text>

  <rect class="lane" x="255" y="78" width="220" height="236" rx="10"/>
  <text class="label" x="278" y="110">SNV/indel evidence</text>
  <rect class="box" x="290" y="132" width="150" height="42"/>
  <text class="text" x="328" y="158">ANNOVAR</text>
  <rect class="box" x="290" y="190" width="150" height="42"/>
