<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">Variant Prioritization Detail</title>
  <desc id="desc">Focused workflow figure for SNV and SV prioritization with inheritance-aware assignment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#405d78"/>
    </marker>
    <style>
      .canvas { fill: #f8fafb; }
      .lane { fill: #f0f4f7; stroke: #9fb5c6; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #405d78; stroke-width: 1.5; rx: 8; }
      .context { fill: #fbf7e9; stroke: #9c7b35; }
      .assign { fill: #f5fbf4; stroke: #4c7b57; }
      .output { fill: #edf6fb; stroke: #336b87; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #173245; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #223642; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #415866; }
      .flow { fill: none; stroke: #405d78; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1260" height="760"/>
  <text class="label" x="40" y="44">Figure 2. Variant Prioritization Detail</text>

  <rect class="box context" x="40" y="92" width="170" height="74"/>
