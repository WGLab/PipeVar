<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">PipeVar evidence prioritization</title>
  <desc id="desc">Phenotype, small-variant, structural-variant, copy-number, and optional phasing evidence pass through quality, frequency, inheritance, and evidence-class rules to prioritized files and reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#46657a"/>
    </marker>
    <style>
      .canvas { fill: #f8fafb; }
      .source { fill: #eef6fb; stroke: #3f728f; }
      .filter { fill: #fff8e7; stroke: #9a7834; }
      .rank { fill: #eef7ef; stroke: #4c7b57; }
      .note { fill: #f5f6f7; stroke: #8a99a3; }
      .box { stroke-width: 1.6; rx: 10; }
      .title { font: 700 22px Arial, sans-serif; fill: #173245; }
      .heading { font: 700 16px Arial, sans-serif; fill: #173245; }
      .text { font: 15px Arial, sans-serif; fill: #263b48; }
      .small { font: 13px Arial, sans-serif; fill: #465d69; }
      .flow { fill: none; stroke: #46657a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1000" height="560"/>
  <text class="title" x="35" y="42">PipeVar evidence prioritization</text>
  <text class="small" x="35" y="66">Evidence types retain their meaning; unlike scores are not treated as interchangeable.</text>

  <rect class="box source" x="35" y="105" width="205" height="75"/>
  <text class="heading" x="56" y="135">Phenotype evidence</text>
  <text class="small" x="56" y="158">HPO terms · ranked genes</text>

  <rect class="box source" x="35" y="205" width="205" height="95"/>
  <text class="heading" x="56" y="235">Small-variant evidence</text>
  <text class="small" x="56" y="258">ANNOVAR · ClinVar</text>
  <text class="small" x="56" y="280">RankVar · RankScore</text>

  <rect class="box source" x="35" y="325" width="205" height="95"/>
  <text class="heading" x="56" y="355">Structural/CNV evidence</text>
  <text class="small" x="56" y="378">annotations · PhenoSV</text>
  <text class="small" x="56" y="400">cohort frequency matches</text>

  <rect class="box source" x="35" y="445" width="205" height="65"/>
  <text class="heading" x="56" y="475">Phasing context</text>
  <text class="small" x="56" y="497">when available</text>

  <rect class="box filter" x="310" y="190" width="190" height="190"/>
  <text class="heading" x="333" y="222">Apply thresholds</text>
  <text class="small" x="333" y="253">quality and depth</text>
  <text class="small" x="333" y="278">population frequency</text>
  <text class="small" x="333" y="303">phenotype relevance</text>
  <text class="small" x="333" y="328">accepted ClinVar evidence</text>
  <text class="small" x="333" y="353">event-level SV rules</text>

  <rect class="box filter" x="560" y="190" width="175" height="190"/>
  <text class="heading" x="581" y="222">Apply inheritance</text>
  <text class="small" x="581" y="253">dominant scenarios</text>
  <text class="small" x="581" y="278">recessive scenarios</text>
  <text class="small" x="581" y="303">compound pairs</text>
  <text class="small" x="581" y="328">phase consistency</text>
  <text class="small" x="581" y="353">when available</text>

  <rect class="box rank" x="795" y="190" width="165" height="190"/>
  <text class="heading" x="818" y="222">Rank candidates</text>
  <text class="small" x="818" y="253">evidence classes</text>
  <text class="small" x="818" y="278">deterministic ties</text>
  <text class="small" x="818" y="315">prioritized VCF</text>
  <text class="small" x="818" y="340">gene-level VCF</text>
  <text class="small" x="818" y="365">HTML when supported</text>

  <path class="flow" d="M240,142 H275 V225 H310"/>
  <path class="flow" d="M240,252 H310"/>
  <path class="flow" d="M240,372 H275 V335 H310"/>
  <path class="flow" d="M240,477 H530 V350 H560"/>
  <path class="flow" d="M500,285 H560"/>
  <path class="flow" d="M735,285 H795"/>

  <rect class="box note" x="310" y="455" width="650" height="55"/>
  <text class="small" x="333" y="487">Dominant: one altered copy may contribute. Recessive: two contributing copies are generally considered.</text>
</svg>
