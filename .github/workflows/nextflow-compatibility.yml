name: Nextflow compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane:
          - 24.10.6@default
          - 25.04.8@default
          - 25.10.7@v1
          - 25.10.7@v2
          - 26.04.6@default
          - 26.04.6@v1

    steps:
      - name: Check out PipeVar
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the official Nextflow launcher
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://get.nextflow.io --output /tmp/nextflow
          chmod +x /tmp/nextflow

      - name: Run compatibility lane
        shell: bash
        env:
          NEXTFLOW_BIN: /tmp/nextflow
          NEXTFLOW_COMPATIBILITY_LANES: ${{ matrix.lane }}
          COMPAT_ROOT: ${{ runner.temp }}/pipevar-nextflow-compat/${{ matrix.lane }}
        run: bash scripts/check_nextflow_compatibility.sh

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-compatibility-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pipevar-nextflow-compat/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 14
